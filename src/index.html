<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stukje Notes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg:        #0a0a0a;
      --bg2:       #111111;
      --bg3:       #1a1a1a;
      --bg4:       #222222;
      --border:    #2a2a2a;
      --border2:   #333333;
      --text:      #e8e8e8;
      --text2:     #888888;
      --text3:     #555555;
      --accent:    #e8e8e8;
      --accent-dim:#444444;
      --danger:    #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      overflow: hidden;
      user-select: none;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      min-width: 200px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.25s ease, opacity 0.25s ease;
    }

    #sidebar.hidden {
      margin-left: -240px;
      opacity: 0;
      pointer-events: none;
    }

    #sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #logo {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    #logo-mark {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    #logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #sidebar-actions {
      display: flex;
      gap: 8px;
    }

    #btn-new {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #btn-new:hover {
      background: var(--bg4);
      border-color: var(--text3);
    }

    #btn-import {
      width: 34px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    #btn-import:hover {
      background: var(--bg4);
      color: var(--text);
      border-color: var(--text3);
    }

    #btn-new svg, #btn-import svg { flex-shrink: 0; }

    /* Search */
    #search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search::placeholder { color: var(--text3); }
    #search:focus { border-color: var(--text3); color: var(--text); }

    /* Notes list */
    #notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    #notes-list::-webkit-scrollbar { width: 3px; }
    #notes-list::-webkit-scrollbar-track { background: transparent; }
    #notes-list::-webkit-scrollbar-thumb { background: var(--border2); }

    .note-item {
      padding: 10px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s, border-color 0.1s;
      position: relative;
    }

    .note-item:hover { background: var(--bg3); }

    .note-item.active {
      background: var(--bg3);
      border-left-color: var(--text);
    }

    .note-item-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .note-item-meta {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      margin-bottom: 4px;
    }

    .note-item-preview {
      font-size: 11px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #no-notes {
      padding: 24px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      text-align: center;
      line-height: 1.8;
    }

    /* ── Editor area ── */
    #editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* Toolbar */
    #toolbar {
      padding: 0 24px;
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tb-spacer { flex: 1; }

    .tb-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text2);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 5px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s, border-color 0.15s;
      text-transform: uppercase;
    }

    .tb-btn:hover { color: var(--text); border-color: var(--border2); }
    .tb-btn.danger:hover { color: #aaaaaa; border-color: #444; }
    .tb-btn svg { flex-shrink: 0; }

    #word-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.5px;
    }

    #save-status {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.5px;
      min-width: 60px;
      text-align: right;
    }

    /* Title */
    #note-title {
      padding: 20px 28px 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    #note-title::placeholder { color: var(--text3); }

    /* Divider under title */
    #title-divider {
      margin: 10px 28px 0;
      border: none;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Content */
    #note-content {
      flex: 1;
      padding: 16px 28px 28px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      overflow-y: auto;
      user-select: text;
    }

    #note-content::placeholder { color: var(--text3); }

    #note-content::-webkit-scrollbar { width: 3px; }
    #note-content::-webkit-scrollbar-track { background: transparent; }
    #note-content::-webkit-scrollbar-thumb { background: var(--border2); }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      user-select: none;
    }

    #empty-glyph {
      font-family: 'DM Mono', monospace;
      font-size: 48px;
      color: var(--border2);
      line-height: 1;
    }

    #empty-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text2);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 8px 18px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Delete confirm ── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #confirm-overlay.show { display: flex; }

    #confirm-box {
      background: var(--bg2);
      border: 1px solid var(--border2);
      padding: 28px 32px;
      max-width: 320px;
      width: 90%;
    }

    #confirm-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    #confirm-msg {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    #confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .conf-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 7px 16px;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: none;
      color: var(--text2);
      transition: color 0.15s, border-color 0.15s;
    }

    .conf-btn:hover { color: var(--text); border-color: var(--text3); }
    .conf-btn.destructive { color: #888; }
    .conf-btn.destructive:hover { color: #bbb; border-color: #666; }
  </style>
</head>
<body>
<div id="app">

  <!-- Sidebar -->
  <div id="sidebar" class="hidden">
    <div id="sidebar-header">
      <div id="logo">
        <span id="logo-mark">stukje</span>
        <span id="logo-sub">notes</span>
      </div>
      <div id="sidebar-actions">
        <button id="btn-new">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="1.5"/>
            <line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          New Note
        </button>
        <button id="btn-import" title="Import TXT">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="search notes…" autocomplete="off" spellcheck="false"/>
    </div>
    <div id="notes-list"></div>
  </div>

  <!-- Editor -->
  <div id="editor-area">
    <!-- Toolbar -->
    <div id="toolbar">
      <button class="tb-btn" id="btn-toggle" title="Toggle Sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <span id="word-count"></span>
      <div class="tb-spacer"></div>
      <span id="save-status"></span>
      <button class="tb-btn" id="btn-export" style="display:none">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1v7M3 5.5l3 3 3-3M1 9.5v1h10v-1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Export
      </button>
      <button class="tb-btn danger" id="btn-delete" style="display:none">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 3h8M5 3V2h2v1M4.5 3l.5 7M7.5 3l-.5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Delete
      </button>
    </div>

    <!-- Empty state -->
    <div id="empty-state">
      <div id="empty-glyph">∅</div>
      <div id="empty-label">no note selected</div>
    </div>

    <!-- Note editor (hidden when no note) -->
    <input id="note-title" type="text" placeholder="untitled note" autocomplete="off" spellcheck="false" style="display:none"/>
    <hr id="title-divider" style="display:none"/>
    <textarea id="note-content" placeholder="start writing…" spellcheck="false" style="display:none"></textarea>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Delete confirm -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <div id="confirm-title">Delete this note?</div>
    <div id="confirm-msg">This action cannot be undone.</div>
    <div id="confirm-actions">
      <button class="conf-btn" id="conf-cancel">Cancel</button>
      <button class="conf-btn destructive" id="conf-delete">Delete</button>
    </div>
  </div>
</div>

<script>
const api = window.stukje;

// State
let notes = [];
let activeId = null;
let saveTimer = null;
let searchQuery = '';

// Elements
const sidebar     = document.getElementById('sidebar');
const notesList   = document.getElementById('notes-list');
const noteTitle   = document.getElementById('note-title');
const noteContent = document.getElementById('note-content');
const titleDiv    = document.getElementById('title-divider');
const emptyState  = document.getElementById('empty-state');
const btnToggle   = document.getElementById('btn-toggle');
const btnImport   = document.getElementById('btn-import');
const btnExport   = document.getElementById('btn-export');
const btnDelete   = document.getElementById('btn-delete');
const wordCount   = document.getElementById('word-count');
const saveStatus  = document.getElementById('save-status');
const searchInput = document.getElementById('search');
const toast       = document.getElementById('toast');
const confirmOv   = document.getElementById('confirm-overlay');

// ── Helpers ──────────────────────────────────────────────

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function updateWordCount() {
  const words = noteContent.value.trim().split(/\s+/).filter(Boolean).length;
  wordCount.textContent = words ? `${words} word${words !== 1 ? 's' : ''}` : '';
}

function showEditor() {
  emptyState.style.display = 'none';
  noteTitle.style.display  = 'block';
  titleDiv.style.display   = 'block';
  noteContent.style.display = 'block';
  btnExport.style.display  = '';
  btnDelete.style.display  = '';
}

function showEmpty() {
  emptyState.style.display = 'flex';
  noteTitle.style.display  = 'none';
  titleDiv.style.display   = 'none';
  noteContent.style.display = 'none';
  btnExport.style.display  = 'none';
  btnDelete.style.display  = 'none';
  wordCount.textContent = '';
  saveStatus.textContent = '';
}

// ── Render sidebar ────────────────────────────────────────

function renderList() {
  const filtered = notes.filter(n => {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return n.title.toLowerCase().includes(q) || n.preview.toLowerCase().includes(q);
  });

  if (filtered.length === 0) {
    notesList.innerHTML = `<div id="no-notes">${searchQuery ? 'no results' : 'no notes yet\ncreate one above'}</div>`;
    return;
  }

  notesList.innerHTML = filtered.map(n => `
    <div class="note-item ${n.id === activeId ? 'active' : ''}" data-id="${n.id}">
      <div class="note-item-title">${escHtml(n.title || 'untitled')}</div>
      <div class="note-item-meta">${formatDate(n.modified)}</div>
      <div class="note-item-preview">${escHtml(n.preview) || '—'}</div>
    </div>
  `).join('');

  notesList.querySelectorAll('.note-item').forEach(el => {
    el.addEventListener('click', () => openNote(el.dataset.id));
  });
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Notes operations ──────────────────────────────────────

async function loadList() {
  const res = await api.listNotes();
  if (res.ok) { notes = res.notes; renderList(); }
}

async function openNote(id) {
  if (activeId === id) return;
  await saveCurrentIfNeeded();
  const res = await api.loadNote(id);
  if (!res.ok) { showToast('could not open note'); return; }
  activeId = id;
  noteTitle.value   = res.title;
  noteContent.value = res.content;
  showEditor();
  noteContent.focus();
  updateWordCount();
  saveStatus.textContent = '';
  renderList();
}

async function newNote() {
  await saveCurrentIfNeeded();
  const id = await api.newId();
  activeId = id;
  noteTitle.value   = '';
  noteContent.value = '';
  showEditor();
  noteTitle.focus();
  saveStatus.textContent = '';
  wordCount.textContent  = '';
  // Add a placeholder entry
  notes.unshift({ id, title: '', preview: '', modified: new Date().toISOString() });
  renderList();
}

async function saveCurrentIfNeeded() {
  if (!activeId) return;
  clearTimeout(saveTimer);
  const title   = noteTitle.value.trim() || 'untitled';
  const content = noteContent.value;
  const res = await api.saveNote({ id: activeId, title, content });
  if (res.ok) {
    const idx = notes.findIndex(n => n.id === activeId);
    const entry = { id: activeId, title, preview: content.slice(0,100).replace(/\n/g,' '), modified: new Date().toISOString() };
    if (idx >= 0) notes[idx] = entry; else notes.unshift(entry);
    notes.sort((a,b) => new Date(b.modified) - new Date(a.modified));
    saveStatus.textContent = 'saved';
    setTimeout(() => { if (saveStatus.textContent === 'saved') saveStatus.textContent = ''; }, 2000);
    renderList();
  }
}

function scheduleAutoSave() {
  clearTimeout(saveTimer);
  saveStatus.textContent = '…';
  saveTimer = setTimeout(() => saveCurrentIfNeeded(), 900);
}

async function deleteCurrentNote() {
  if (!activeId) return;
  const res = await api.deleteNote(activeId);
  if (!res.ok) { showToast('could not delete note'); return; }
  notes = notes.filter(n => n.id !== activeId);
  activeId = null;
  showEmpty();
  renderList();
  showToast('note deleted');
}

async function exportCurrentNote() {
  if (!activeId) return;
  const title   = noteTitle.value.trim() || 'untitled';
  const content = noteContent.value;
  const res = await api.export({ title, content });
  if (res.ok) showToast('exported successfully');
  else if (!res.canceled) showToast('export failed');
}

async function importNote() {
  const res = await api.importTxt();
  if (res.ok) {
    await saveCurrentIfNeeded();
    const id = await api.newId();
    activeId = id;
    noteTitle.value   = res.title;
    noteContent.value = res.content;
    showEditor();
    noteContent.focus();
    updateWordCount();
    // Save it immediately
    await api.saveNote({ id, title: res.title, content: res.content });
    notes.unshift({ id, title: res.title, preview: res.content.slice(0,100).replace(/\n/g,' '), modified: new Date().toISOString() });
    renderList();
    showToast('imported successfully');
  } else if (!res.canceled) {
    showToast('import failed');
  }
}

// ── Events ────────────────────────────────────────────────

document.getElementById('btn-new').addEventListener('click', newNote);

btnImport.addEventListener('click', importNote);

btnToggle.addEventListener('click', () => {
  sidebar.classList.toggle('hidden');
});

document.getElementById('btn-export').addEventListener('click', exportCurrentNote);

document.getElementById('btn-delete').addEventListener('click', () => {
  confirmOv.classList.add('show');
});

document.getElementById('conf-cancel').addEventListener('click', () => {
  confirmOv.classList.remove('show');
});

document.getElementById('conf-delete').addEventListener('click', async () => {
  confirmOv.classList.remove('show');
  await deleteCurrentNote();
});

noteTitle.addEventListener('input', scheduleAutoSave);
noteContent.addEventListener('input', () => { scheduleAutoSave(); updateWordCount(); });

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  renderList();
});

// Tab key inserts spaces in textarea
noteContent.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = noteContent.selectionStart;
    const end = noteContent.selectionEnd;
    noteContent.value = noteContent.value.substring(0, s) + '  ' + noteContent.value.substring(end);
    noteContent.selectionStart = noteContent.selectionEnd = s + 2;
  }
  // Ctrl/Cmd+S
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrentIfNeeded();
  }
});

noteTitle.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); noteContent.focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrentIfNeeded(); }
});

// Click outside confirm to cancel
confirmOv.addEventListener('click', e => {
  if (e.target === confirmOv) confirmOv.classList.remove('show');
});

// ── Init ─────────────────────────────────────────────────

(async () => {
  await loadList();
  newNote();
})();
</script>
</body>
</html>
